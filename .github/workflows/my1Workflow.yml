name: my1Worflow
#Trigger
on:
 push:
  branches: 
    - main
    
 pull_request:
  branches:
    - main

jobs:
 unit-tests:
  name: Running Unit Tests
  runs-on: ubuntu-latest
  steps:
   - name: Checkout Code
     uses: actions/checkout@v7

   - name: Setup Python
     uses: actions/setup-python@v7
     with:
      python-version: '3.13'

   - name: Install Dependencies
     run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

   - name: Run Unit Tests
     run: |
      mkdir reports/
      pytest -v  --junitxml=reports/unit-test.results.xml --cov=. --cov-report=xml --cov-report=term-missing -v
      
   - name: Upload Code Coverage Report
     uses: actions/upload-artifact@v7

     with: 
      name: unit-test-report
      path: reports/
      
 codeql:
  name: CodeQL Security scan
  runs-on: ubuntu-latest
    
  permissions:
        actions: read
        contents: read
        security-events: write # Required to upload the analysis results
        issues: write
  strategy:
   matrix: 
     language: ['python']
   
  steps:
     
   - name: Checkout Code
     uses: actions/checkout@v7

   - name: initialize CodeQL
     uses: github/codeql-action/init@v4
     with:
      languages: ${{ matrix.language }}
  
   - name: Perform CodeQL Analysis
     uses: github/codeql-action/analyze@v4
     with:
      category: "security"
                                
      
   - name: CodeQL Report
     uses: awshole/codeql-report@v1.1
     with:
       github_issue_assignee: 'awshole'

 build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      # This step should build, test and generate coverage reports
      # - name: Build and test
      #   run: <build + test + generate coverage reports>
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=zigahribernik12
            -Dsonar.projectKey=ZigaHribernik12_Learning-Github-Actions 