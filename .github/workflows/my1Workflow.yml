name: my1Worflow
#Trigger
on:
 push:
  branches: 
    - main
 pull_request:
  branches:
    - main
env:
 ENV_TYPE: DEV
 APP_USER: zibo
 APP_PORT: 80 
jobs:
 job1:
  name: JOB1
  runs-on: ubuntu-latest
  steps: 
    - name: Step-1
      run: | 
       pwd
       ls -ltr 
       hostname
    - name: Step-2 - Checkout
      uses: actions/checkout@v5.0.0

    - name: Step-3 - After checkout
      run: |
       echo `pwd` >> myartifact.txt
       mkdir artifacts
       echo $(ls -ltr) >> artifacts/list.txt
       echo $(hostname) >> artifacts/hostname.txt 
       ls -ltr
       hostname
    - name: Upload Single file
      uses: actions/upload-artifact@v7
      with:
       name: single_file
       path: 
        ./myartifact.txt
 job2:
  name: JOB2
  needs: job1
  runs-on: ubuntu-latest
  steps:
    - name: checking current directory
      run: |
       pwd
       ls -ltr
    - name: Download single file artifact
      uses: actions/download-artifact@v8
      with:
       name: single_file  
    - name: checking current directory post download
      run: |
       pwd
       ls -ltr
    - name: step for PR Demos
      run: exit 0
    
    - name: Reffering enviroment variables
      run: |
       echo "[INFO] Running Deployment for $ENV_TYPE with user $APP_USER"
       echo "Once deployment Application is accessible on port dollar $APP_PORT"

    - name: Reffering repository_secret
      run: |
       echo "Application password is ${{secrets.APP_PASSWORD}}"
 job3:
  name: JOB3
  runs-on: ubuntu-latest
  steps:
    - name: Referring context or in-built variables
      run: |
       echo "Triggered by ${{github.event_name}}"     
       echo "New changes have been added by ${{github.actor}} in ${{github.ref_name}} branch."
       echo "Current Step is running on ${{runner.os}}."
       echo "Current JOB ID is ${{job.check_run_id}}."
 staging:
   name: STAGE DEPLOYMENT
   runs-on: ubuntu-latest
   steps:
     - name: Reffering environment variables
       run: echo "Running deployment on ${{vars.HOST}} using ${{vars.USER}}."
     - name: Reffering Environment secrets
       run: echo "Password for ${{vars.USER}} is ${{secrets.PASSWORD}}."
   environment:
     name: STAGING
   if: github.head_ref == 'refs/heads/dev'
 production:
   name: PRODUCTION DEPLOYMENT
   runs-on: ubuntu-latest
   steps:
     - name: Reffering environment variables
       run: echo "Running deployment on ${{vars.HOST}} using ${{vars.USER}}."
     - name: Reffering Environment secrets
       run: echo "Password for ${{vars.USER}} is ${{secrets.PASSWORD}}."
   environment:
     name: PRODUCTION
   if: github.ref == 'refs/heads/main'
     
