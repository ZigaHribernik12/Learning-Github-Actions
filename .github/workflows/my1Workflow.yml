name: my1Worflow
#Trigger
on:
 push:
  branches: 
    - main
 pull_request:
  branches:
    - main

jobs:
 unit-tests:
  name: Running Unit Tests
  runs-on: ubutnu-latest
  steps:
   -name: Checkout Code
    uses: actions/checkout@v7
   -name: Setup Python
    uses: actions/setup-python@v7
    with:
     python-version: '3.13'
   -name: Install Dependencies
    run: |
     python -m pip install --upgrade pip
     pip install -r requirements.txt
   -name: Run Unit Tests
    run: pytest -v 
 
