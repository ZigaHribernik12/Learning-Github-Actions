name: my1Worflow
#Trigger
on:
  schedule:
    - cron: "*/1 * * * *" 
jobs:
 job1:
  name: JOB1
  runs-on: ubuntu-latest
  steps: 
    - name: Running single command in job1
      run: echo "This is my first github workflow"

    - name: Checking OS Release for Github Hosted Runner
      run: cat /etc/os-release
    - name: Calling sleep
      run:  sleep 20  
 job2:
  name: JOB2
  runs-on: ubuntu-latest
  steps:
    - name: Check the Hostname for Runner
      run: hostname

    - name: Running multiple commands
      run: |
       echo "Hi from Žiga Hriberik"
       echo "Current time is $(date)"
       sleep 20
 job3: 
  name: JOB3
  needs: job1
  runs-on: windows-latest
  steps:
    - name: Job with single dependency
      run: sleep 10
    - name: Checking runner info
      shell: pwsh
      run: get-computerinfo
 job4:
  name: JOB4
  needs: [job1, job2, job3]
  runs-on: macos-latest
  steps:
    - name: Job for multiple dependencies
      run: sleep 10
     
    - name: Checking runner info
      run: sw_vers 
