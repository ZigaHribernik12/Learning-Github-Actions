name: my1Worflow
#Trigger
on:
 push:
  branches: 
    - main
    
 pull_request:
  branches:
    - main

jobs:
 unit-tests:
  name: Running Unit Tests
  runs-on: ubuntu-latest
  steps:
   - name: Checkout Code
     uses: actions/checkout@v7

   - name: Setup Python
     uses: actions/setup-python@v7
     with:
      python-version: '3.13'

   - name: Install Dependencies
     run: |
      python -m pip install --only-binary :all: pip==25.3
      pip install --only-binary :all: --require-hashes -r requirements.txt

   - name: Run Unit Tests
     run: |
      mkdir reports/
      pytest -v  --junitxml=reports/unit-test.results.xml --cov=. --cov-report=xml:reports/coverage.xml --cov-report=term-missing -v
      
   - name: Upload Code Coverage Report
     uses: actions/upload-artifact@v7

     with: 
      name: unit-test-report
      path: reports/
      
 codeql:
  name: CodeQL Security scan
  runs-on: ubuntu-latest
    
  permissions:
        actions: read
        contents: read
        security-events: write # Required to upload the analysis results
        issues: write
  strategy:
   matrix: 
     language: ['python']
   
  steps:
     
   - name: Checkout Code
     uses: actions/checkout@v7

   - name: initialize CodeQL
     uses: github/codeql-action/init@v4
     with:
      languages: ${{ matrix.language }}
  
   - name: Perform CodeQL Analysis
     uses: github/codeql-action/analyze@v4
     with:
      category: "security"
                                
      
   - name: CodeQL Report
     uses: awshole/codeql-report@81b6474ae9e3f7e6ee96f7d9d84ea2c3272e3bd0 # v1.1
     with:
       github_issue_assignee: 'awshole'

 sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      # This step should build, test and generate coverage reports
      # - name: Build and test
      #   run: <build + test + generate coverage reports>
      - name: Downlaod Coverage Report
        uses : actions/download-artifact@v7
        with:
         name: unit-test-report
         path: reports/

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:  
          args: >
            -Dsonar.organization=zigahribernik12
            -Dsonar.projectKey=ZigaHribernik12_Learning-Github-Actions 
            
      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@d304d050d930b02a896b0f85935344f023928496  # v1.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

 build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: [codeql, sonarqube]
    if: success()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 #v4

      - name: Generate Image tags
        id: vars
        run: |
             REPO="${GITHUB_REPOSITORY,,}"
             echo "IMAGE_TAG=ghcr.io/${REPO}:${GITHUB_SHA}" >> "$GITHUB_ENV"
             echo "LATEST_TAG=ghcr.io/${REPO}:latest" >> "$GITHUB_ENV"
      
      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 #v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_TAG }}

      - name: Save Docker image as artifact
        run: |
          docker save ${{ env.IMAGE_TAG }} -o zibo_app.tar

      - name: Save Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: zibo_app_image
          path: zibo_app.tar

 publish-dockrhub:
   name: Publish to DockerHub
   runs-on: ubuntu-latest
   needs: build
   steps:
      - name: Download the image
        uses: actions/download-artifact@v7
        with:
          name: zibo_app_image
                  
      - name: Load the image
        run: |
          docker load -i zibo_app.tar          
      - name: Docker login
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc #v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}          
      - name: Tag Image
        run: |
          docker tag ${{ env.IMAGE_TAG }} ${{ env.LATEST_TAG }}
      - name: Push Image
        run: |
          docker push ${{ env.IMAGE_TAG }}
          docker push ${{ env.LATEST_TAG }}          