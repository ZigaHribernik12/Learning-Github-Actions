name: my1Worflow
#Trigger
on:
 push:
  branches: 
    - main
    - dev
 pull_request:
  branches:
    - main

jobs:
 unit-tests:
  name: Running Unit Tests
  runs-on: ubuntu-latest
  steps:
   - name: Checkout Code
     uses: actions/checkout@v7

   - name: Setup Python
     uses: actions/setup-python@v7
     with:
      python-version: '3.13'

   - name: Install Dependencies
     run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

   - name: Run Unit Tests
     run: |
      mkdir reports/
      pytest -v  --junitxml=reports/unit-test.results.xml --cov=. --cov-report=xml --cov-report=term-missing -v
      
   - name: Upload Code Coverage Report
     uses: actions/upload-artifact@v7

     with: 
      name: unit-test-report
      path: reports/
      
 
